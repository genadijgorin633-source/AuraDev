<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SWIFT SHOP — Video Intro</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5c9fe9;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}

    .stage{
      position:relative;
      width:min(100vw,calc(100vh * 16 / 9));
      aspect-ratio:16/9;
      overflow:hidden;
      isolation:isolate;
      background:linear-gradient(110deg,#5b99df 0%,#77afea 38%,#69a2e4 62%,#8cc0f2 100%);
    }

    /* Blue silk / curtain base */
    .curtain,.curtain::before,.curtain::after{position:absolute;inset:-10%;content:"";pointer-events:none}
    .curtain{
      z-index:-5;
      background:
        radial-gradient(90% 110% at 6% 45%,rgba(255,255,255,.22),transparent 46%),
        radial-gradient(80% 120% at 92% 56%,rgba(255,255,255,.13),transparent 48%),
        linear-gradient(100deg,#5a96dc 0%,#77afe9 33%,#649fe3 54%,#82b8ed 74%,#669fe0 100%);
      animation:curtainShift 10s ease-in-out infinite alternate;
    }
    .curtain::before{
      background:repeating-linear-gradient(96deg,
        rgba(255,255,255,.02) 0 4%,
        rgba(255,255,255,.18) 8%,
        rgba(46,108,177,.16) 13%,
        rgba(255,255,255,.13) 19%,
        rgba(72,133,199,.13) 25%,
        rgba(255,255,255,.05) 31%);
      filter:blur(18px);
      transform:scale(1.2) skewX(-3deg);
      opacity:.92;
      animation:folds 8s ease-in-out infinite alternate;
    }
    .curtain::after{
      background:
        radial-gradient(ellipse at 20% 40%,rgba(255,255,255,.30),transparent 21%),
        radial-gradient(ellipse at 48% 56%,rgba(255,255,255,.16),transparent 20%),
        radial-gradient(ellipse at 78% 42%,rgba(255,255,255,.24),transparent 23%);
      filter:blur(46px);
      mix-blend-mode:screen;
      opacity:.55;
      animation:sheen 7s ease-in-out infinite alternate;
    }

    .silk-lines{position:absolute;inset:-16%;z-index:-4;filter:blur(7px);opacity:.42;transform:rotate(-3deg)}
    .silk-lines::before,.silk-lines::after{content:"";position:absolute;inset:0}
    .silk-lines::before{
      background:repeating-linear-gradient(103deg,transparent 0 9%,rgba(255,255,255,.14) 12%,transparent 16% 23%);
      animation:flow 12s linear infinite;
    }
    .silk-lines::after{
      background:linear-gradient(100deg,transparent 0 28%,rgba(255,255,255,.28) 45%,transparent 59%);
      transform:translateX(-80%);
      animation:glint 6s ease-in-out infinite;
    }

    .brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(28px,3.1vw,66px);transform:translateX(-2.5%)}
    .wordmark{
      margin:0;color:#fff;font-size:clamp(46px,7.1vw,146px);line-height:.92;font-weight:800;letter-spacing:.018em;white-space:nowrap;
      text-shadow:0 8px 26px rgba(40,91,153,.15);
      opacity:0;filter:blur(12px);transform:translateX(-42px) scale(.985);
      animation:titleIn 1.1s cubic-bezier(.18,.86,.25,1) .55s forwards;
    }

    .feather-wrap{
      position:relative;width:clamp(100px,11vw,220px);height:clamp(100px,11vw,220px);display:grid;place-items:center;
      opacity:0;transform:translate(135px,-70px) rotate(9deg) scale(.92);filter:blur(4px) drop-shadow(0 12px 24px rgba(39,95,156,.12));
      animation:featherIn 1.15s cubic-bezier(.16,.9,.2,1.1) 1.05s forwards,featherFloat 5s ease-in-out 2.5s infinite;
    }
    .feather-wrap::before{
      content:"";position:absolute;left:-120%;right:15%;top:39%;height:22%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),rgba(255,255,255,.44),transparent);
      filter:blur(13px);transform:scaleX(.12);transform-origin:right center;opacity:0;
      animation:trail 1s ease-out 1.02s forwards;
    }
    .feather{
      width:100%;height:100%;object-fit:contain;display:block;
      filter:brightness(0) invert(1) drop-shadow(0 3px 8px rgba(40,99,164,.08));
    }

    .soft-light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 82% 8%,rgba(255,255,255,.24),transparent 29%),radial-gradient(circle at 52% 48%,rgba(255,255,255,.08),transparent 46%);mix-blend-mode:screen}
    .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 53%,rgba(33,91,158,.11) 100%)}

    .replay{position:absolute;right:14px;bottom:14px;padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(35,91,155,.12);color:white;font:600 11px/1 inherit;letter-spacing:.06em;backdrop-filter:blur(10px);cursor:pointer;opacity:.42;transition:.2s}
    .replay:hover{opacity:.9;background:rgba(35,91,155,.2)}

    @keyframes curtainShift{0%{transform:translate3d(-1.8%,0,0) scale(1.03)}100%{transform:translate3d(2.2%,-.8%,0) scale(1.065)}}
    @keyframes folds{0%{transform:scale(1.2) skewX(-3deg) translateX(-2%)}100%{transform:scale(1.24) skewX(2deg) translateX(2.5%)}}
    @keyframes sheen{0%{transform:translateX(-4%) scale(1)}100%{transform:translateX(5%) scale(1.08);opacity:.68}}
    @keyframes flow{from{transform:translateX(-4%)}to{transform:translateX(6%)}}
    @keyframes glint{0%,12%{transform:translateX(-90%);opacity:0}36%{opacity:.75}58%,100%{transform:translateX(95%);opacity:0}}
    @keyframes titleIn{0%{opacity:0;filter:blur(12px);transform:translateX(-42px) scale(.985)}72%{opacity:1;filter:blur(0);transform:translateX(3px) scale(1.004)}100%{opacity:1;filter:blur(0);transform:none}}
    @keyframes featherIn{0%{opacity:0;transform:translate(135px,-70px) rotate(9deg) scale(.92);filter:blur(4px)}75%{opacity:1;transform:translate(-4px,3px) rotate(-1.5deg) scale(1.018);filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
    @keyframes featherFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.6deg)}}
    @keyframes trail{0%{opacity:0;transform:scaleX(.12)}35%{opacity:.75}100%{opacity:0;transform:scaleX(1)}}

    @media(max-width:720px){.brand{gap:20px;transform:translateX(-1.5%)}.wordmark{font-size:clamp(34px,8vw,68px)}.feather-wrap{width:clamp(72px,12vw,100px);height:clamp(72px,12vw,100px)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.wordmark,.feather-wrap{opacity:1;filter:none;transform:none}}
  </style>
</head>
<body>
  <main class="stage" aria-label="SWIFT SHOP animated intro">
    <div class="curtain"></div>
    <div class="silk-lines"></div>
    <div class="soft-light"></div>

    <section class="brand">
      <h1 class="wordmark">SWIFT SHOP</h1>
      <div class="feather-wrap" aria-hidden="true">
        <img class="feather" src="https://swiftsms.xyz/agreement/favicon.png" alt="" />
      </div>
    </section>

    <div class="vignette"></div>
    <button class="replay" type="button" onclick="location.reload()">REPLAY</button>
  </main>
</body>
</html>
