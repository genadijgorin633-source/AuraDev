<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SWIFT SHOP — Video Intro</title>
  <style>
    :root {
      --sky-1: #4b91e9;
      --sky-2: #7fb5f1;
      --sky-3: #d9edff;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111827;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 87% 6%, rgba(255,255,255,.95) 0 3%, rgba(255,255,255,.46) 10%, transparent 28%),
        linear-gradient(135deg, var(--sky-1) 0%, var(--sky-2) 54%, var(--sky-3) 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: -4;
      background:
        radial-gradient(ellipse at 16% 86%, rgba(255,255,255,.42), transparent 26%),
        radial-gradient(ellipse at 92% 81%, rgba(255,255,255,.70), transparent 21%),
        radial-gradient(ellipse at 55% 108%, rgba(255,255,255,.72), transparent 32%);
      filter: blur(30px);
      animation: cloudDrift 14s ease-in-out infinite alternate;
    }

    .light-rays {
      position: absolute;
      inset: -10%;
      z-index: -3;
      opacity: .52;
      background: repeating-linear-gradient(118deg, transparent 0 11%, rgba(255,255,255,.15) 14%, transparent 20%);
      filter: blur(8px);
      transform: translateX(-6%);
      animation: rays 9s ease-in-out infinite alternate;
    }

    .mist {
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: -28%;
      height: 56%;
      z-index: -2;
      background:
        radial-gradient(ellipse at 18% 40%, rgba(255,255,255,.80) 0 10%, transparent 31%),
        radial-gradient(ellipse at 46% 56%, rgba(255,255,255,.58) 0 14%, transparent 36%),
        radial-gradient(ellipse at 77% 40%, rgba(255,255,255,.76) 0 13%, transparent 34%);
      filter: blur(18px);
      animation: mist 11s ease-in-out infinite alternate;
    }

    .particles { position:absolute; inset:0; z-index:-1; overflow:hidden; }
    .particle {
      position: absolute;
      width: .42vmin;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 0 1.2vmin rgba(255,255,255,.8);
      opacity: 0;
      animation: particleFloat var(--d) ease-in-out var(--delay) infinite;
    }

    .brand {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(22px, 3vw, 72px);
      padding-right: 2.5%;
      transform: translateX(-1.8%);
    }

    .wordmark {
      margin: 0;
      color: var(--white);
      font-weight: 760;
      font-size: clamp(46px, 7.3vw, 150px);
      line-height: .9;
      letter-spacing: .025em;
      white-space: nowrap;
      text-shadow: 0 8px 24px rgba(22, 81, 150, .16);
      opacity: 0;
      filter: blur(14px);
      transform: translateX(-48px) scale(.985);
      animation: titleIn 1.15s cubic-bezier(.16,.9,.25,1) .72s forwards;
    }

    .feather-wrap {
      position: relative;
      width: clamp(86px, 10.5vw, 210px);
      aspect-ratio: .74;
      opacity: 0;
      transform: translate(160px,-95px) rotate(16deg) scale(.88);
      filter: blur(5px) drop-shadow(0 10px 22px rgba(38,105,179,.16));
      animation: featherIn 1.25s cubic-bezier(.17,.89,.25,1.13) 1.25s forwards,
                 featherFloat 4.6s ease-in-out 2.8s infinite;
    }

    .feather-wrap::before {
      content:"";
      position:absolute;
      inset: 24% -42% 10% -72%;
      z-index:-1;
      background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.08) 30%, rgba(255,255,255,.42) 70%, transparent 100%);
      filter: blur(10px);
      transform: rotate(-11deg) scaleX(.1);
      transform-origin: right center;
      opacity: 0;
      animation: trail 1.1s ease-out 1.22s forwards;
    }

    .feather { width:100%; height:100%; display:block; }

    .shine {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 24%;
      left: -36%;
      transform: skewX(-19deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.20), transparent);
      filter: blur(7px);
      opacity: .8;
      animation: sweep 5.2s ease-in-out 3s infinite;
    }

    .vignette {
      position:absolute;
      inset:0;
      pointer-events:none;
      background: radial-gradient(circle at 50% 48%, transparent 48%, rgba(18,82,151,.10) 100%);
      mix-blend-mode:multiply;
      opacity:.55;
    }

    .replay {
      position:absolute;
      right:16px;
      bottom:16px;
      border:1px solid rgba(255,255,255,.3);
      background:rgba(26,78,138,.18);
      color:#fff;
      border-radius:999px;
      padding:9px 14px;
      font:600 12px/1 inherit;
      letter-spacing:.03em;
      backdrop-filter: blur(9px);
      cursor:pointer;
      opacity:.58;
      transition:.2s ease;
    }
    .replay:hover { opacity:1; background:rgba(26,78,138,.28); }

    @keyframes titleIn {
      0% { opacity:0; filter:blur(14px); transform:translateX(-48px) scale(.985); }
      66% { opacity:1; filter:blur(0); transform:translateX(4px) scale(1.006); }
      100% { opacity:1; filter:blur(0); transform:translateX(0) scale(1); }
    }

    @keyframes featherIn {
      0% { opacity:0; transform:translate(160px,-95px) rotate(16deg) scale(.88); filter:blur(5px) drop-shadow(0 10px 22px rgba(38,105,179,.16)); }
      72% { opacity:1; transform:translate(-6px,5px) rotate(-3deg) scale(1.025); filter:blur(0) drop-shadow(0 10px 22px rgba(38,105,179,.16)); }
      100% { opacity:1; transform:translate(0,0) rotate(0) scale(1); filter:blur(0) drop-shadow(0 10px 22px rgba(38,105,179,.16)); }
    }

    @keyframes featherFloat {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(.8deg); }
    }

    @keyframes trail {
      0% { opacity:0; transform:rotate(-11deg) scaleX(.08); }
      35% { opacity:.75; }
      100% { opacity:0; transform:rotate(-11deg) scaleX(1); }
    }

    @keyframes cloudDrift { to { transform: translate3d(3%, -1.5%, 0) scale(1.03); } }
    @keyframes rays { to { transform: translateX(5%) rotate(.6deg); opacity:.65; } }
    @keyframes mist { to { transform:translateX(3%) scale(1.04); } }
    @keyframes sweep {
      0%, 18% { left:-36%; opacity:0; }
      30% { opacity:.75; }
      48% { left:115%; opacity:0; }
      100% { left:115%; opacity:0; }
    }
    @keyframes particleFloat {
      0% { opacity:0; transform:translateY(12px) scale(.7); }
      30% { opacity:.85; }
      70% { opacity:.45; }
      100% { opacity:0; transform:translateY(-34px) scale(1.15); }
    }

    @media (max-width: 720px) {
      .brand { gap: 18px; transform: translateX(-1%); }
      .wordmark { font-size: clamp(35px, 8.1vw, 70px); }
      .feather-wrap { width: clamp(62px, 12vw, 95px); }
      .replay { right:10px; bottom:10px; padding:7px 11px; font-size:10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; }
      .wordmark, .feather-wrap { opacity:1; filter:none; transform:none; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="SWIFT SHOP animated video intro">
    <div class="light-rays"></div>
    <div class="mist"></div>
    <div class="particles" id="particles"></div>
    <div class="shine"></div>

    <section class="brand">
      <h1 class="wordmark">SWIFT SHOP</h1>
      <div class="feather-wrap" aria-hidden="true">
        <svg class="feather" viewBox="0 0 160 220" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 199C50 155 83 107 131 37" stroke="white" stroke-width="9" stroke-linecap="round"/>
          <path d="M43 166C51 118 73 71 117 32C128 22 140 15 149 13C150 36 145 58 133 77C118 102 96 117 69 122C64 136 56 151 43 166Z" fill="white"/>
          <path d="M74 112L124 57" stroke="#8FC2F5" stroke-width="5" stroke-linecap="round" opacity=".9"/>
          <path d="M58 132L36 123L76 105" fill="white"/>
          <path d="M77 108L59 88L96 79" fill="white"/>
          <path d="M97 84L83 62L119 50" fill="white"/>
          <path d="M61 137L88 138L70 154" fill="white"/>
          <path d="M79 113L111 112L91 132" fill="white"/>
        </svg>
      </div>
    </section>

    <div class="vignette"></div>
    <button class="replay" id="replay" type="button">REPLAY</button>
  </main>

  <script>
    const particles = document.getElementById('particles');
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('i');
      p.className = 'particle';
      p.style.left = `${8 + Math.random() * 84}%`;
      p.style.top = `${12 + Math.random() * 72}%`;
      p.style.setProperty('--d', `${4.2 + Math.random() * 4.8}s`);
      p.style.setProperty('--delay', `${Math.random() * 5}s`);
      p.style.transform = `scale(${.7 + Math.random()})`;
      particles.appendChild(p);
    }

    const replay = document.getElementById('replay');
    replay.addEventListener('click', () => {
      const fresh = document.querySelector('.stage').cloneNode(true);
      document.querySelector('.stage').replaceWith(fresh);
      location.reload();
    });
  </script>
</body>
</html>
