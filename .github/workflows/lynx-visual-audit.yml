name: LYNX visual audit
on:
  push:
    paths:
      - '.github/workflows/lynx-visual-audit.yml'
      - 'lynix_curator/index.html'
      - 'lynix_curator/styles.css'
      - 'lynix_curator/app.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser controller
        run: python -m pip install playwright
      - name: Capture responsive layouts
        run: python lynix_curator/scripts/visual_audit.py
      - name: Save audit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lynix_curator/audit/*.png
          if ! git diff --cached --quiet; then
            git commit -m "test(lynx): capture desktop and mobile page screenshots [skip ci]"
            git push
          fi
